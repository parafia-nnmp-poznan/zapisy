<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5fae">
<meta name="description" content="Zapisy na czytania, psalm, modlitwę powszechną i procesję z darami.">
<title>Zapisy na posługi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="progress" id="progress" hidden><div class="progress-bar"></div></div>

<header class="page-header">
  <h1>Zapisy na posługi liturgiczne</h1>
  <p class="subtitle" id="mode"></p>
</header>

<div class="toolbar-wrap">
  <div class="toolbar" role="toolbar" aria-label="Akcje">
    <button type="button" class="btn" id="btnRefresh">Odśwież</button>
    <button type="button" class="btn" id="btnPrint">Drukuj</button>
    <button type="button" class="btn" id="btnMode">Tryb zakrystii</button>
  </div>
</div>

<main>
  <div id="banner" class="banner" role="status" hidden></div>

  <section class="filters" aria-label="Filtry listy">
    <div class="field">
      <label for="fDate">Data</label>
      <select id="fDate"></select>
    </div>
    <div class="field">
      <label for="fTime">Godzina</label>
      <select id="fTime"></select>
    </div>
    <div class="field field-wide">
      <label for="fPerson">Osoba</label>
      <input id="fPerson" type="search" placeholder="Imię lub nazwisko" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="filters-footer">
      <label class="check"><input type="checkbox" id="fFree"> Tylko wolne miejsca</label>
      <button type="button" class="btn small" id="btnClear" hidden>Wyczyść filtry</button>
      <span class="muted" id="count" aria-live="polite"></span>
    </div>
  </section>

  <div id="list"></div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="overlay" id="overlay">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <h2 id="dialogTitle"></h2>
    <div id="dialogBody"></div>
    <p class="dialog-status" id="dialogStatus" role="status" aria-live="polite"></p>
    <div class="buttons" id="dialogButtons"></div>
  </div>
</div>

<noscript><p class="banner">Do działania aplikacji potrzebny jest JavaScript.</p></noscript>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
